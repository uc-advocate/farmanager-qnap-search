[package]
name = "nas_indexd"
version = "0.2.0"
edition = "2021"
description = "Ultra-fast in-memory filename & path search daemon for QNAP NAS with real-time filesystem watcher"

[dependencies]
notify = "7"
walkdir = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
